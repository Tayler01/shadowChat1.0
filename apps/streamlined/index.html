<!doctype html>
<html lang="en" class="original dark" data-scheme="original" data-theme-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#0d0f10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="icon" href="/icons/favicon-32.png" />

    <title>ShadowChat · Streamlined</title>
    <link rel="stylesheet" href="./startup.css" />

      <div id="streamlined-document-startup" class="streamlined-loading streamlined-loading--fullscreen" role="status" aria-live="polite" aria-busy="true">
