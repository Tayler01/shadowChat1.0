name: Netlify Preview Deploy

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: netlify-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Secretless PR validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:node
      - run: npm run supabase:functions:verify
      - run: npm run build
      - run: npx jest --runInBand

  deploy:
    name: Protected preview deploy
    needs: validate
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment: netlify-preview
    outputs:
      preview_url: ${{ steps.preview.outputs.url }}
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      NETLIFY_CLI_VERSION: 26.0.0
      VITE_APP_BUILD_ID: ${{ github.sha }}
      VITE_APP_COMMIT_SHA: ${{ github.sha }}
      VITE_APP_DEPLOY_CONTEXT: deploy-preview
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify Netlify secrets
        run: |
          test -n "$NETLIFY_AUTH_TOKEN" || { echo 'NETLIFY_AUTH_TOKEN is not configured.'; exit 1; }
          test -n "$NETLIFY_SITE_ID" || { echo 'NETLIFY_SITE_ID is not configured.'; exit 1; }
      - name: Write app build metadata
        run: |
          cat > .env.production.local <<EOF
          VITE_APP_BUILD_ID=${VITE_APP_BUILD_ID}
          VITE_APP_COMMIT_SHA=${VITE_APP_COMMIT_SHA}
          VITE_APP_DEPLOY_CONTEXT=${VITE_APP_DEPLOY_CONTEXT}
          EOF
      - name: Build with Netlify preview environment
        run: npx --yes "netlify@$NETLIFY_CLI_VERSION" build --context deploy-preview

      - name: Verify app build metadata
        run: node scripts/verify-app-build-metadata.mjs
      - name: Deploy Netlify preview
        run: |
          npx --yes "netlify@$NETLIFY_CLI_VERSION" deploy \
            --context deploy-preview --dir=dist --functions=.netlify/functions \
            --skip-functions-cache --alias="pr-${{ github.event.pull_request.number }}" \
            --message="GitHub Actions preview PR #${{ github.event.pull_request.number }} ${{ github.sha }}" \
            --json > netlify-preview.json
      - name: Capture preview URL
        id: preview
        run: |
          node <<'NODE'
          const fs = require('fs')
          const data = JSON.parse(fs.readFileSync('netlify-preview.json', 'utf8'))
          const url = data.deploy_url || data.deployUrl || data.ssl_url || data.url
          if (!url) process.exit(1)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `url=${url}\n`)
          NODE

  comment:
    name: Publish preview link
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ needs.deploy.outputs.preview_url }}
        with:
          script: |
            const marker = '<!-- shadowchat-netlify-preview -->'
            const body = `${marker}\nNetlify preview is ready:\n${process.env.PREVIEW_URL}\n\nBuilt from \`${context.sha.slice(0, 7)}\`.`
            const { owner, repo } = context.repo
            const issue_number = context.payload.pull_request.number
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 })
            const existing = comments.find(comment => comment.body?.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }
