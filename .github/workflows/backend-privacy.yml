name: Backend Privacy Phases

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Exact backend phase (never publishes a frontend)
        required: true
        type: choice
        options:
          - foundation
          - producers
          - deletion-handover
          - activation
      apply:
        description: Apply the reviewed phase; false only validates its immutable plan
        required: true
        type: boolean
        default: false
      acceptance:
        description: Fresh runtime acceptance JSON for producers or activation; no credentials or member data
        required: false
        type: string

permissions:
  contents: read
  packages: read
  security-events: write

# Share the ordinary production lock: phases and normal publishing cannot race.
concurrency:
  group: netlify-production-refs/heads/main
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  security:
    uses: ./.github/workflows/security-scans.yml

  codeql:
    uses: ./.github/workflows/codeql.yml

  backend:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: [quality, security, codeql]
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      BUNNY_STREAM_LIBRARY_ID: ${{ vars.BUNNY_STREAM_LIBRARY_ID }}
      SECURITY_RELEASE_PHASE: ${{ inputs.phase }}
      SECURITY_RELEASE_APPLY: ${{ inputs.apply }}
      SECURITY_RELEASE_ACCEPTANCE: ${{ inputs.acceptance }}
    steps:
      - name: Check out the exact main source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.109.1

      - name: Install dependencies
        run: npm ci

      - name: Verify release orchestration
        run: node --test tests/backendPrivacyRelease.node.test.mjs tests/accountDeletionReleaseGate.node.test.mjs tests/supabaseFunctionManifest.node.test.mjs tests/legacyDeletionScheduler.node.test.mjs

      - name: Execute only the selected backend phase
        run: |
          if [ "$SECURITY_RELEASE_APPLY" = "true" ]; then
            node scripts/backend-privacy-release.mjs --phase "$SECURITY_RELEASE_PHASE" --apply
          else
            node scripts/backend-privacy-release.mjs --phase "$SECURITY_RELEASE_PHASE" --plan
          fi

      - name: Retain backend release evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-privacy-${{ inputs.phase }}-${{ github.sha }}
          path: output/release-evidence/backend-privacy-*.json
          if-no-files-found: ignore
          retention-days: 30
