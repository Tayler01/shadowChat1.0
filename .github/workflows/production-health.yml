name: Production Health

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    environment: production-monitoring
    env:
      PRODUCTION_APP_URL: ${{ vars.PRODUCTION_APP_URL }}
      MONITOR_SUPABASE_URL: ${{ secrets.MONITOR_SUPABASE_URL }}
      MONITOR_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.MONITOR_SUPABASE_SERVICE_ROLE_KEY }}
      NEWS_MAX_AGE_MINUTES: ${{ vars.NEWS_MAX_AGE_MINUTES }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check app uptime and News freshness
        run: node scripts/check-production-health.mjs
      - name: Route sanitized failure to Slack when configured
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        run: |
          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            --data "{\"text\":\"ShadowChat production health failed. Review: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}" \
            "$SLACK_WEBHOOK_URL"
