name: Netlify Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  security-events: write

concurrency:
  group: netlify-production-${{ github.ref }}
  # A later push must not interrupt a partially applied backend release.
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  security:
    uses: ./.github/workflows/security-scans.yml

  codeql:
    uses: ./.github/workflows/codeql.yml

  deploy:
    name: Build and deploy
    # Hold the full-app publisher during the separate streamlined rollout.
    # Backend phases have their own workflow and do not publish a frontend.
    if: ${{ github.ref == 'refs/heads/main' && vars.STREAMLINED_BACKEND_ROLLOUT_HOLD != 'true' }}
    needs: [quality, security, codeql]
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      NETLIFY_CLI_VERSION: 26.0.0
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      BUNNY_STREAM_LIBRARY_ID: ${{ vars.BUNNY_STREAM_LIBRARY_ID }}
      VITE_APP_BUILD_ID: ${{ github.sha }}
      VITE_APP_COMMIT_SHA: ${{ github.sha }}
      VITE_APP_DEPLOY_CONTEXT: production
      APP_RELEASE_BEFORE_SHA: ${{ github.event.before }}
      APP_RELEASE_HEAD_SHA: ${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.109.1

      - name: Verify deploy secrets
        run: |
          test -n "$NETLIFY_AUTH_TOKEN" || { echo "NETLIFY_AUTH_TOKEN is not configured."; exit 1; }
          test -n "$NETLIFY_SITE_ID" || { echo "NETLIFY_SITE_ID is not configured."; exit 1; }
          test -n "$SUPABASE_URL" || { echo "SUPABASE_URL is not configured."; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "SUPABASE_SERVICE_ROLE_KEY is not configured."; exit 1; }
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "SUPABASE_ACCESS_TOKEN is not configured."; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "SUPABASE_DB_PASSWORD is not configured."; exit 1; }
          test -n "$SUPABASE_PROJECT_ID" || { echo "SUPABASE_PROJECT_ID is not configured."; exit 1; }
          [[ "$SUPABASE_ACCESS_TOKEN" =~ ^sbp_(oauth_)?[a-f0-9]{40}$ ]] || {
            echo "SUPABASE_ACCESS_TOKEN is not a valid newline-free Supabase personal access token."
            exit 1
          }

      - name: Link production Supabase
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Preview production migrations
        run: supabase db push --linked --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Install dependencies
        run: npm ci

      - name: Write app build metadata
        run: |
          cat > .env.production.local <<EOF
          VITE_APP_BUILD_ID=${VITE_APP_BUILD_ID}
          VITE_APP_COMMIT_SHA=${VITE_APP_COMMIT_SHA}
          VITE_APP_DEPLOY_CONTEXT=${VITE_APP_DEPLOY_CONTEXT}
          EOF

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Node tests
        run: npm run test:node

      - name: Jest
        run: npx jest --runInBand

      - name: Verify Supabase function manifest
        run: npm run supabase:functions:verify

      - name: Build with Netlify environment
        run: npx --yes "netlify@$NETLIFY_CLI_VERSION" build

      - name: Verify app build metadata
        run: node scripts/verify-app-build-metadata.mjs

      # This blocks implicit activation BEFORE any schema/config mutation.
      # The explicit backend workflow completes the reviewed phases first.
      # It proves live metadata only; client compatibility is a separate gate.
      - name: Verify explicit backend security activation is complete
        run: node scripts/backend-privacy-release.mjs --production-check

      - name: Verify deletion preparation before backend changes
        run: npm run supabase:deletion:release-check

      - name: Apply production migrations
        run: supabase db push --linked --yes --password "$SUPABASE_DB_PASSWORD"

      - name: Recheck deletion preparation before function publication
        run: npm run supabase:deletion:release-check

      - name: Align Supabase Auth and function configuration
        run: supabase config push --project-ref "$SUPABASE_PROJECT_ID" --yes

      - name: Deploy and verify classified Edge Functions
        run: npm run supabase:functions:deploy

      - name: Revoke dedicated ESP Bridge Auth sessions
        run: npm run supabase:bridge-auth:pause

      - name: Verify ESP Bridge Auth hold
        run: npm run supabase:bridge-auth:verify

      - name: Capture backend release evidence
        run: |
          mkdir -p output/release-evidence
          supabase migration list --linked --password "$SUPABASE_DB_PASSWORD" > output/release-evidence/migrations.txt
          supabase db push --linked --dry-run --password "$SUPABASE_DB_PASSWORD" > output/release-evidence/migration-dry-run.txt
          supabase functions list --project-ref "$SUPABASE_PROJECT_ID" --output json > output/release-evidence/functions.json
          supabase secrets list --project-ref "$SUPABASE_PROJECT_ID" --output json > "$RUNNER_TEMP/supabase-secrets.json"

      - name: Upload backend release evidence
        uses: actions/upload-artifact@v6
        with:
          name: supabase-release-${{ github.sha }}
          path: output/release-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Deploy to Netlify production
        run: |
          npx --yes "netlify@$NETLIFY_CLI_VERSION" deploy \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --site "$NETLIFY_SITE_ID" \
            --prod \
            --dir=dist \
            --functions=.netlify/functions \
            --skip-functions-cache \
            --message "GitHub Actions production deploy ${{ github.sha }}" \
            --json > netlify-production.json

      - name: Publish in-app release
        run: node scripts/publish-app-release.mjs --netlify-json netlify-production.json

      - name: Record sanitized operations release evidence
        env:
          OPERATIONS_MIGRATIONS_CURRENT: "true"
          OPERATIONS_HEALTH_COMMIT_SHA: ${{ github.sha }}
        run: |
          node scripts/record-operations-health.mjs \
            --functions output/release-evidence/functions.json \
            --secrets "$RUNNER_TEMP/supabase-secrets.json" \
            --netlify netlify-production.json \
            --build dist/.well-known/shadowchat-health.json

      - name: Verify and record production health
        env:
          PRODUCTION_APP_URL: ${{ vars.PRODUCTION_APP_URL }}
          MONITOR_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          MONITOR_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEWS_MONITOR_ENABLED: "false"
          OPERATIONS_HEALTH_COMMIT_SHA: ${{ github.sha }}
        run: node scripts/check-production-health.mjs
