version: 2
# ShadowChat uses a main-only release policy. Keep Dependabot configuration in
# place for future reactivation, but do not let scheduled updates create branch
# and pull-request drift. Dependency audits, Trivy, and CodeQL remain enforced
# by the main production workflow.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      development-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
    open-pull-requests-limit: 0
  - package-ecosystem: npm
    directory: /services/news-scraper
    schedule:
      interval: weekly
      day: monday
    groups:
      worker-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 0
  - package-ecosystem: docker
    directory: /services/news-scraper
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
